name: Deploy Frontend to Production (Plesk via SFTP)

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          NODE_ENV=production npm run build
          ls -la dist/

      - name: Create deployment success file
        run: |
          echo '{"status":"deployed","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","environment":"production","method":"sftp","commit":"'$GITHUB_SHA'"}' > deploy-success.json

      - name: Create deployment package
        run: |
          # Create .htaccess for SPA routing
          cat > ./dist/.htaccess << 'EOF'
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^(.*)$ /index.html [QSA,L]

          # Security headers
          Header always set X-Frame-Options DENY
          Header always set X-Content-Type-Options nosniff
          Header always set Referrer-Policy strict-origin-when-cross-origin

          # Cache static assets
          <filesMatch ".(css|jpg|jpeg|png|gif|js|ico|svg|woff|woff2|ttf|eot)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 month"
            Header append Cache-Control "public"
          </filesMatch>
          EOF

      - name: Backup and clean frontend files (preserve API)
        run: |
          lftp -u ${{ secrets.PLESK_SFTP_USER }},${{ secrets.PLESK_SFTP_PASSWORD }} sftp://${{ secrets.PLESK_SFTP_HOST }}:22 << 'EOF'
          set sftp:auto-confirm yes
          
          # Create backup directory with timestamp
          !mkdir -p ../backups 2>/dev/null || true
          
          # Backup current frontend (exclude api folder)
          cd httpdocs
          mirror --verbose --exclude api/ --exclude .well-known/ . ../backups/frontend-backup-$(date +%Y%m%d_%H%M%S)
          
          echo "Backup completed successfully"
          
          # Now clean frontend files only
          echo "Starting frontend cleanup..."
          
          # Remove HTML files
          mrm -f *.html 2>/dev/null || true
          # Remove JS files
          mrm -f *.js 2>/dev/null || true
          # Remove CSS files
          mrm -f *.css 2>/dev/null || true
          # Remove JSON files (except those in api folder)
          mrm -f *.json 2>/dev/null || true
          # Remove image files
          mrm -f *.ico *.png *.jpg *.svg 2>/dev/null || true
          # Remove assets directory
          rm -rf assets 2>/dev/null || true
          # Remove static directory
          rm -rf static 2>/dev/null || true
          
          echo "Frontend cleanup completed, API folder preserved"
          
          bye
          EOF

      - name: Deploy to production
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.PLESK_SFTP_USER }}
          server: ${{ secrets.PLESK_SFTP_HOST }}
          password: ${{ secrets.PLESK_SFTP_PASSWORD }}
          port: 22
          local_path: "./dist/*"
          remote_path: "./httpdocs/"
          sftpArgs: "-o ConnectTimeout=5"
          sftp_only: true

      - name: Upload deployment success file
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.PLESK_SFTP_USER }}
          server: ${{ secrets.PLESK_SFTP_HOST }}
          password: ${{ secrets.PLESK_SFTP_PASSWORD }}
          local_path: "./deploy-success.json"
          remote_path: "./httpdocs/deploy-success.json"
          sftp_only: true

      - name: Health Check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          # Check if site is responding
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://quick-retail.com)
          
          if [ $HTTP_STATUS -eq 200 ]; then
            echo "✅ Deployment successful - Site is responding with HTTP $HTTP_STATUS"
            echo "🚀 React app is now live alongside the API at https://quick-retail.com"
          else
            echo "⚠️ Deployment may have issues - Site responding with HTTP $HTTP_STATUS"
            echo "💡 Check backup at ../backups/frontend-backup-* if rollback needed"
            exit 1
          fi
