name: Deploy Frontend to Production (Plesk via SFTP)

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies and build
        run: |
          npm ci --no-audit --no-fund
          NODE_ENV=production npm run build
          ls -la dist/

      - name: Create .htaccess file
        run: |
          cat > ./dist/.htaccess << 'HTACCESS'
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^(.*)$ /index.html [QSA,L]
          # Security headers
          Header always set X-Frame-Options DENY
          Header always set X-Content-Type-Options nosniff
          Header always set Referrer-Policy strict-origin-when-cross-origin
          # Cache static assets
          <filesMatch ".(css|jpg|jpeg|png|gif|js|ico|svg|woff|woff2|ttf|eot)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 month"
            Header append Cache-Control "public"
          </filesMatch>
          HTACCESS

      - name: Create deployment metadata
        run: |
          echo "{\"status\":\"deployed\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"environment\":\"production\",\"method\":\"sftp\",\"commit\":\"$GITHUB_SHA\"}" > ./dist/deploy-success.json

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Backup current frontend
        env:
          SFTP_USER: ${{ secrets.PLESK_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.PLESK_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.PLESK_SFTP_HOST }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          lftp -c "
          set sftp:auto-confirm yes
          open sftp://$SFTP_USER:$SFTP_PASSWORD@$SFTP_HOST:22
          
          mkdir -p ../backups 2>/dev/null || true
          cd httpdocs
          mirror --verbose --exclude api/ --exclude .well-known/ . ../backups/frontend-backup-$TIMESTAMP
          
          echo 'Backup completed: frontend-backup-$TIMESTAMP'
          bye
          "

      - name: Clean old frontend files
        env:
          SFTP_USER: ${{ secrets.PLESK_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.PLESK_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.PLESK_SFTP_HOST }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          open sftp://$SFTP_USER:$SFTP_PASSWORD@$SFTP_HOST:22
          
          cd httpdocs
          
          echo 'Cleaning frontend files (preserving api folder)...'
          
          cls -1 | grep -E '\.(html|js|css|json|ico|png|jpg|svg)$' | xargs -I {} rm -f {} 2>/dev/null || true
          rm -rf assets 2>/dev/null || true
          rm -rf static 2>/dev/null || true
          
          echo 'Frontend cleanup completed'
          bye
          "

      - name: Deploy new frontend
        env:
          SFTP_USER: ${{ secrets.PLESK_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.PLESK_SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.PLESK_SFTP_HOST }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes
          open sftp://$SFTP_USER:$SFTP_PASSWORD@$SFTP_HOST:22
          
          cd httpdocs
          lcd dist
          
          echo 'Uploading new frontend files...'
          mirror --reverse --verbose --delete-first --exclude .git/ --exclude node_modules/
          
          echo 'Deployment completed successfully'
          bye
          "

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://quick-retail.com)
          
          if [ $HTTP_STATUS -eq 200 ]; then
            echo "Deployment successful!"
            echo "Site is live at https://quick-retail.com"
            echo "HTTP Status: $HTTP_STATUS"
          else
            echo "Deployment verification failed"
            echo "HTTP Status: $HTTP_STATUS"
            echo "Rollback backup available at: backups/frontend-backup-*"
            exit 1
          fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "Deployment completed successfully at $(date)"
          else
            echo "Deployment encountered issues at $(date)"
          fi
